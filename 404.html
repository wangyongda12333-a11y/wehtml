<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · X.Z.C 资源站</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f9f8;
        color: #172220;
        font-family: "DM Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        text-align: center;
      }
      .wrap { padding: 40px 24px; max-width: 480px; }
      .code {
        font-size: 96px;
        font-weight: 700;
        color: #174f44;
        line-height: 1;
        letter-spacing: 4px;
      }
      .dot {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #d8f06b;
        margin: 0 6px;
        vertical-align: 18px;
      }
      h1 { font-size: 22px; margin: 24px 0 8px; }
      p { color: #71807d; margin: 0 0 28px; font-size: 15px; }
      a {
        display: inline-block;
        background: #174f44;
        color: #fff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 10px;
        font-weight: 600;
        transition: opacity .2s;
      }
      a:hover { opacity: .85; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">4<span class="dot"></span>4</div>
      <h1>页面不存在</h1>
      <p>你访问的地址不存在或已被移除，返回首页继续探索。</p>
      <a href="/">← 返回首页</a>
    </div>
  </body>
</html>
